# Matugen template: yazi file manager theme from wallpaper

[mode]
normal_main = { fg = "#003739", bg = "#f1ffff", bold = true }
normal_alt  = { fg = "#f1ffff", bg = "reset" }
select_main = { fg = "#003739", bg = "#9fcfd2", bold = true }
select_alt  = { fg = "#9fcfd2", bg = "reset" }
unset_main  = { fg = "#3b2f00", bg = "#fffaff", bold = true }
unset_alt   = { fg = "#fffaff", bg = "reset" }

[status]
overall = { fg = "reset", bg = "reset" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "#f1ffff", bold = true }
perm_read  = { fg = "#fffaff" }
perm_write = { fg = "#9fcfd2" }
perm_exec  = { fg = "#ffb4ab" }
perm_sep   = { fg = "#859394" }

progress_label  = { fg = "#dde4e4", bold = true }
progress_normal = { fg = "#f1ffff", bg = "reset" }
progress_error  = { fg = "#ffb4ab", bg = "reset" }

[mgr]
cwd = { fg = "#f1ffff", bold = true }

find_keyword  = { fg = "#fffaff", bold = true, italic = true, underline = true }
find_position = { fg = "#9fcfd2", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#f1ffff", bg = "#f1ffff" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#9fcfd2", bg = "#9fcfd2" }
marker_selected = { fg = "#fffaff", bg = "#fffaff" }

count_copied   = { fg = "#003739", bg = "#f1ffff" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#3b2f00", bg = "#fffaff" }

border_symbol = "│"
border_style  = { fg = "#859394" }

hovered = { bg = "#343a3b" }

[indicator]
parent  = { fg = "#9fcfd2", bold = true }
current = { fg = "#f1ffff", bold = true }
preview = { fg = "#859394", bold = true }
padding = { open = "", close = " " }

[tabs]
active   = { fg = "#003739", bg = "#f1ffff" }
inactive = { fg = "#dde4e4", bg = "#1a2121" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border   = { fg = "#f1ffff" }
title    = { fg = "#f1ffff" }
value    = { fg = "#dde4e4" }
selected = { reversed = true }

[pick]
border   = { fg = "#f1ffff" }
active   = { fg = "#003739", bg = "#f1ffff" }
inactive = { fg = "#dde4e4" }

[confirm]
border = { fg = "#f1ffff" }
title  = { fg = "#f1ffff" }
body   = { fg = "#dde4e4" }
list   = { fg = "#dde4e4" }
btn_yes = { fg = "#003739", bg = "#f1ffff" }
btn_no  = { fg = "#690005", bg = "#ffb4ab" }
btn_labels = [ " Yes ", " No " ]

[notify]
title_info  = { fg = "#f1ffff" }
title_warn  = { fg = "#fffaff" }
title_error = { fg = "#ffb4ab" }

[help]
on     = { fg = "#f1ffff" }
run    = { fg = "#9fcfd2" }
desc   = { fg = "#dde4e4" }
hovered = { reversed = true }
footer  = { fg = "#859394" }

[which]
cols = 3
mask = { bg = "#1a2121" }
cand = { fg = "#f1ffff" }
rest = { fg = "#859394" }
desc = { fg = "#dde4e4" }
separator = " → "
separator_style = { fg = "#859394" }

[tasks]
border  = { fg = "#f1ffff" }
title   = { fg = "#f1ffff" }
hovered = { reversed = true }

[filetype]
rules = [
    { mime = "image/*", fg = "#9fcfd2" },
    { mime = "{audio,video}/*", fg = "#9fcfd2" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },
    { mime = "application/{pdf,doc,rtf}", fg = "#f1ffff" },
    { url = "*/", fg = "#9fcfd2", bold = true },
    { url = "*", fg = "#fffaff" },
]

[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
