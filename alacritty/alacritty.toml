[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
opacity = 0.5
padding = { x = 22, y = 22 }

[font]
size = 11

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "Regular"

[cursor]
style = { shape = "Beam" }

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/usr/bin/fish"

[colors.primary]
background = "#11111b"
foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.selection]
text = "#11111b"
background = "#f5e0dc"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[terminal]
